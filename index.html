<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DecantX — Payday Essentials</title>
<style>
  /* ============================================================
     DecantX "Payday Essentials" — a 9:16 social poster.
     A wire market basket sits over a phone mockup; tapping a tile
     inside the phone flies that product up into the basket.
     Orange restatement of the pink reference.
     ============================================================ */
  :root,
  :root[data-theme="dark"],
  :root[data-theme="light"] {
    --cream:       #FAF3EB;  /* the poster ground */
    --cream-deep:  #F2E7DA;
    --tile:        #F1ECE5;  /* product tile fill inside the phone */
    --orange-pale: #F7CDA8;  /* spent / greyed-out state */
    --orange-soft: #F0A96E;  /* title, wire highlights */
    --orange:      #EA8B45;  /* the basket wire */
    --orange-deep: #D2691E;  /* "ADD TO CART", the one strong note */
    --ink:         #3A2A1E;
    --ink-soft:    #8A7563;

    --serif: "Didot", "Bodoni MT", "Playfair Display", "Hoefler Text", Garamond, Georgia, "Times New Roman", serif;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;

    color-scheme: only light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--cream-deep);
    color: var(--ink);
    font-family: var(--sans);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ---------- the poster ---------- */
  .poster {
    position: relative;
    container-type: size;
    width: min(100vw, 56.25dvh);   /* 9:16 */
    height: min(177.78vw, 100dvh);
    background: var(--cream);
    overflow: hidden;
    isolation: isolate;
  }

  /* ---------- title ---------- */
  .title {
    position: absolute;
    top: 6.4%;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-family: var(--serif);
    font-size: 7.4cqw;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.06em;
    color: var(--orange-soft);
    white-space: nowrap;
  }
  .title em { font-style: italic; letter-spacing: 0.02em; }

  /* ---------- wire basket ---------- */
  .basket {
    position: absolute;
    left: 50%;
    top: 15.5%;
    width: 82cqw;
    transform: translateX(-50%);
    aspect-ratio: 400 / 250;
    z-index: 3;                    /* over the phone */
  }
  .basket > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .basket .wire-back  { z-index: 1; }
  .basket .well       { z-index: 2; }
  .basket .wire-front { z-index: 3; pointer-events: none; }

  .basket.jolt { animation: jolt 520ms cubic-bezier(.3,1.5,.4,1); }
  @keyframes jolt {
    30% { transform: translateX(-50%) translateY(4px) scale(1.028, 0.972); }
    65% { transform: translateX(-50%) translateY(-2px) scale(0.99, 1.01); }
  }

  .well {
    /* the basket interior: vials stand on the base and rise past the rim */
    position: absolute;
    left: 22%;
    right: 22%;
    bottom: 22%;
    height: 46%;
    z-index: 2;
  }
  /* Each bottle keeps its own proportions: --ar from the artwork, --s a
     per-product height so a squat extrait doesn't tower over a tall flacon. */
  .well .slot {
    position: absolute;
    bottom: 0;
    height: calc(100% * var(--s, 1));
    aspect-ratio: var(--ar, 0.5);
    transform-origin: 50% 100%;
  }
  .well .slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    display: block;
  }
  .well .slot.landing { animation: land 460ms cubic-bezier(.25,1.5,.45,1); }
  @keyframes land {
    0%   { transform: var(--rest) scale(0.84); }
    55%  { transform: var(--rest) scale(1.06); }
    100% { transform: var(--rest) scale(1); }
  }

  /* ---------- phone ---------- */
  .phone {
    position: absolute;
    left: 50%;
    top: 40.5%;
    transform: translateX(-50%);
    width: 72cqw;
    height: 68cqh;               /* runs off the bottom edge, as in the reference */
    background: #FFFFFF;
    border: 0.9cqw solid #EFE9E1;
    border-radius: 7cqw 7cqw 0 0;
    box-shadow: 0 1.4cqw 3.4cqw rgba(58, 42, 30, 0.10);
    z-index: 2;
    overflow: hidden;
  }
  /* side buttons */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    right: -1.3cqw;
    width: 0.9cqw;
    border-radius: 0 1cqw 1cqw 0;
    background: #EFE9E1;
  }
  .phone::before { top: 15%; height: 9%; }
  .phone::after  { top: 27%; height: 5%; }

  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.6cqw 4.4cqw 0;
    font-family: var(--sans);
    font-size: 2.3cqw;
    font-weight: 600;
    color: var(--ink);
  }
  .island {
    width: 15cqw;
    height: 3.4cqw;
    border-radius: 999px;
    background: #26201A;
    position: relative;
  }
  .island::after {
    content: "";
    position: absolute;
    right: 1cqw;
    top: 50%;
    transform: translateY(-50%);
    width: 1.5cqw;
    height: 1.5cqw;
    border-radius: 50%;
    background: #3E362E;
  }
  .statusbar .sig { display: flex; align-items: center; gap: 0.8cqw; }
  .statusbar .sig svg { height: 2.4cqw; width: auto; display: block; }

  /* in-phone header */
  .appbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 2.6cqw 4.4cqw 1.8cqw;
  }
  .appbar .icon { width: 4.4cqw; color: var(--ink); }
  .appbar .icon svg { width: 100%; height: auto; display: block; }
  .appbar .cart { justify-self: end; }

  .logo {
    height: 5cqw;
    width: auto;
    display: block;
  }

  .rule {
    height: 0.28cqw;
    margin: 0 4.4cqw;
    background: var(--cream-deep);
  }

  /* ---------- product grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3.4cqw 3cqw;
    padding: 3.4cqw 4.4cqw;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5cqw;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
  }
  .card:focus-visible { outline: 0.5cqw solid var(--orange-deep); outline-offset: 0.6cqw; }

  .tile {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.16;
    background: var(--tile);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .tile .shot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 9%;
    height: calc(74% * var(--s, 1));
  }
  .tile .shot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    display: block;
    transition: opacity 420ms ease, filter 420ms ease, transform 260ms ease;
  }

  /* "ADDED TO CART" sits at the top of the tile, per the reference */
  .tile .added {
    position: absolute;
    top: 7%;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--serif);
    font-size: 2.1cqw;
    font-style: italic;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    transition: opacity 300ms ease 120ms;
    pointer-events: none;
  }

  .cta {
    font-family: var(--serif);
    font-style: italic;
    font-size: 2.7cqw;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--orange-deep);
    transition: color 420ms ease;
  }

  .card:not(.spent):hover .tile .shot img { transform: scale(1.04); }

  /* spent state: product ghosts out, label pales, "ADDED TO CART" appears */
  .card.spent .tile .shot img { opacity: 0.24; filter: grayscale(0.8); }
  .card.spent .tile .added { opacity: 1; }
  .card.spent .cta { color: var(--orange-pale); }

  /* the vial in flight, basket-bound */
  .flier {
    position: fixed;
    z-index: 60;
    pointer-events: none;
    will-change: transform;
  }
  .flier img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ---------- reset ---------- */
  .reset {
    position: absolute;
    right: 3cqw;
    top: 2.6cqw;
    z-index: 8;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.9cqw;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: transparent;
    border: 0.18cqw solid var(--orange-pale);
    border-radius: 999px;
    padding: 0.5cqw 1.4cqw;
    opacity: 0.4;
    transition: opacity 180ms ease, border-color 180ms ease;
  }
  .reset:hover { opacity: 1; border-color: var(--orange-soft); }
  .reset:focus-visible { outline: 0.4cqw solid var(--orange-deep); outline-offset: 0.4cqw; }

  /* ---------- oversized 8-bit cursor ---------- */
  @media (hover: hover) and (pointer: fine) {
    body.cursor-on, body.cursor-on * { cursor: none !important; }
  }
  #cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 104px;
    z-index: 90;
    pointer-events: none;
    opacity: 0;
    transition: opacity 160ms ease;
    /* hotspot: the fingertip. 15-wide grid in a 17-wide viewBox at 104px
       => 6.1px per pixel; the fingertip centre is 6.5 px in and 1 px down. */
    margin: -6px 0 0 -40px;
    filter: drop-shadow(0 5px 0 rgba(210, 105, 30, 0.28));
    will-change: transform;
  }
  #cursor.ready { opacity: 1; }
  #cursor svg { display: block; width: 100%; height: auto; }
  #cursor .sprite { transition: transform 90ms cubic-bezier(.3,1.4,.4,1); transform-origin: 38% 5%; }
  #cursor.down .sprite { transform: scale(0.86) translate(2px, 3px); }
  #cursor.over .sprite { transform: scale(1.07) rotate(-4deg); }
  #cursor.over.down .sprite { transform: scale(0.9) rotate(-4deg) translate(2px, 3px); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (hover: none), (pointer: coarse) {
    #cursor { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="poster" id="poster">
  <h1 class="title">PAYDAY <em>ESSENTIALS</em></h1>

  <button class="reset" id="reset" type="button">Reset</button>

  <!-- wire basket: back wires, then the items well, then front wires -->
  <div class="basket" id="basket">
    <svg class="wire-back"  id="wireBack"  viewBox="0 0 400 250" aria-hidden="true"></svg>
    <div class="well" id="well"></div>
    <svg class="wire-front" id="wireFront" viewBox="0 0 400 250" aria-hidden="true"></svg>
  </div>

  <!-- phone mockup -->
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="island"></span>
      <span class="sig">
        <svg viewBox="0 0 20 14" fill="currentColor" aria-hidden="true"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/></svg>
        <svg viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1 5a12 12 0 0 1 16 0"/><path d="M4 8.4a7.5 7.5 0 0 1 10 0"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 26 13" fill="none" aria-hidden="true"><rect x="0.8" y="0.8" width="21" height="11.4" rx="3" stroke="currentColor" stroke-width="1.4"/><rect x="2.6" y="2.6" width="17.4" height="7.8" rx="1.6" fill="currentColor"/><path d="M23.6 4.6v3.8a2.4 2.4 0 0 0 0-3.8z" fill="currentColor"/></svg>
      </span>
    </div>

    <div class="appbar">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1 1.5h20M1 8h20M1 14.5h20"/></svg>
      </span>
      <img class="logo" id="logo" alt="DecantX" />
      <span class="icon cart" aria-hidden="true">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.6h3.1l2.6 12.1h10.4l2.3-8.6H5.6"/><circle cx="8.4" cy="19" r="1.7"/><circle cx="16.4" cy="19" r="1.7"/></svg>
      </span>
    </div>
    <div class="rule"></div>

    <div class="grid" id="grid" aria-label="Products"></div>
  </div>
</div>

<div id="cursor" aria-hidden="true"></div>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

    { key: "delina",   brand: "Parfums de Marly",         name: "Delina Exclusif",  scale: 0.86 },
    { key: "baccarat", brand: "Maison Francis Kurkdjian", name: "Baccarat Rouge 540 Extrait", scale: 0.84 }
  ];

  PRODUCTS.forEach(function (p) {
    var a = ASSETS[p.key];
    p.src = a.src;
    p.ar = a.w / a.h;
  });

  function shotHTML(p) {
    return '<img src="' + p.src + '" alt="' + p.brand + ' ' + p.name + '" draggable="false" />';
  }

  document.getElementById("logo").src = ASSETS.logo.src;

  /* ----------------------------------------------------------
     Wire basket.

     Rather than hand-drawing arcs, the basket is a real rounded
     rectangular frustum projected through a pinhole camera. That
     buys correct perspective, an even mesh around the corners, and
     — because every point knows its own depth — an exact split into
     wires in front of the bottles and wires behind them.
     ---------------------------------------------------------- */
  var BK = {
    topHW: 1.42, topHD: 0.475, topR: 0.20,   // mouth: half-width, half-depth, corner radius
    botHW: 1.18, botHD: 0.350, botR: 0.16,   // base
    H: 0.72,                                  // how deep the basket is
    camY: 1.50, camZ: 2.20, f: 220,           // camera: slightly above, looking down in
    cx: 200, cy: 35.9,
    ribs: 56,                                 // wires around the perimeter
    hoops: [0.24, 0.50, 0.76]                 // horizontal bands, top -> bottom
  };

  function project(p) {
    var d = p[2] + BK.camZ;
    return [BK.cx + BK.f * p[0] / d, BK.cy + BK.f * (BK.camY - p[1]) / d];
  }

  /* Points evenly spaced by arc length around a rounded rectangle in the
     XZ plane, so the mesh doesn't bunch up at the corners. */
  function roundRect(hw, hd, r, n) {
    r = Math.min(r, hw, hd);
    var sx = 2 * (hw - r), sz = 2 * (hd - r), arc = Math.PI * r / 2;
    var per = 2 * sx + 2 * sz + 4 * arc;
    var pts = [];
    for (var i = 0; i < n; i++) {
      var t = per * i / n, x, z;
      // walk: front edge -> right corner -> right edge -> back corner -> ...
      if (t < sx)                    { x = -(hw - r) + t;            z = -hd; }
      else if ((t -= sx) < arc)      { var a = t / arc * Math.PI / 2;
                                       x = (hw - r) + r * Math.sin(a);
                                       z = -(hd - r) - r * Math.cos(a); }
      else if ((t -= arc) < sz)      { x = hw;                       z = -(hd - r) + t; }
      else if ((t -= sz) < arc)      { var b = t / arc * Math.PI / 2;
                                       x = (hw - r) + r * Math.cos(b);
                                       z = (hd - r) + r * Math.sin(b); }
      else if ((t -= arc) < sx)      { x = (hw - r) - t;             z = hd; }
      else if ((t -= sx) < arc)      { var c = t / arc * Math.PI / 2;
                                       x = -(hw - r) - r * Math.sin(c);
                                       z = (hd - r) + r * Math.cos(c); }
      else if ((t -= arc) < sz)      { x = -hw;                      z = (hd - r) - t; }
      else                           { var e = (t - sz) / arc * Math.PI / 2;
                                       x = -(hw - r) - r * Math.cos(e);
                                       z = -(hd - r) - r * Math.sin(e); }
      pts.push([x, z]);
    }
    return pts;
  }

  function ringAt(t) {
    // t = 0 at the mouth, 1 at the base
    var hw = BK.topHW + (BK.botHW - BK.topHW) * t;
    var hd = BK.topHD + (BK.botHD - BK.topHD) * t;
    var r  = BK.topR  + (BK.botR  - BK.topR)  * t;
    var y  = BK.H * (1 - t);
    return roundRect(hw, hd, r, BK.ribs).map(function (p) { return [p[0], y, p[1]]; });
  }

  function path(pts) {
    return "M" + pts.map(function (p) {
      return p[0].toFixed(1) + " " + p[1].toFixed(1);
    }).join(" L");
  }

  /* Split a closed ring into the runs facing the camera (or away). */
  function runs(ring, wantFront) {
    var n = ring.length, isF = ring.map(function (p) { return p[2] < 0; });
    var startAt = 0;
    for (var i = 0; i < n; i++) {
      if (isF[i] !== isF[(i - 1 + n) % n]) { startAt = i; break; }
    }
    var out = [], cur = [];
    for (var k = 0; k <= n; k++) {
      var j = (startAt + k) % n;
      if (k < n && isF[j] === wantFront) {
        cur.push(project(ring[j]));
      } else if (cur.length > 1) {
        out.push(cur); cur = [];
      } else { cur = []; }
    }
    if (cur.length > 1) out.push(cur);
    return out;
  }

  function ringPaths(ring, wantFront) {
    return runs(ring, wantFront).map(function (r) { return '<path d="' + path(r) + '"/>'; }).join("");
  }

  /* A handle: a bent wire loop hinged on one rim rail, folded up and
     leaning in so the two cross above the middle. */
  function handle(zRail, lean, rise, halfSpan, strap, xLean) {
    function bez(p0, c, p1, n) {
      var pts = [];
      for (var i = 0; i <= n; i++) {
        var t = i / n, u = 1 - t;
        pts.push(project([
          u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0],
          u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1],
          u * u * p0[2] + 2 * u * t * c[2] + t * t * p1[2]
        ]));
      }
      return pts;
    }
    var y0 = BK.H;
    var outer = bez([-halfSpan, y0, zRail], [xLean, y0 + rise, lean], [halfSpan, y0, zRail], 26);
    var inner = bez([-halfSpan + strap, y0, zRail],
                    [xLean, y0 + rise * 0.78, lean], [halfSpan - strap, y0, zRail], 26).reverse();
    return '<path d="' + path(outer) + " L" + path(inner).slice(1) + ' Z"/>';
  }

  function buildBasket() {
    var top = ringAt(0), base = ringAt(1);
    var mid = BK.hoops.map(ringAt);

    var thinB = 'fill="none" stroke="var(--orange)" stroke-width="1.9" stroke-linecap="round" opacity=".38"';
    var thinF = 'fill="none" stroke="var(--orange)" stroke-width="2.6" stroke-linecap="round"';
    var rail  = 'fill="none" stroke="var(--orange)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"';
    var railB = 'fill="none" stroke="var(--orange)" stroke-width="4" stroke-linecap="round" opacity=".45"';
    var gleam = 'fill="none" stroke="var(--orange-soft)" stroke-width="1.5" stroke-linecap="round" opacity=".55"';
    var strapS = 'fill="none" stroke="var(--orange)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"';

    // vertical wires, sorted by which side of the basket they sit on
    var ribsF = [], ribsB = [];
    for (var i = 0; i < BK.ribs; i++) {
      var a = project(top[i]), b = project(base[i]);
      var seg = '<path d="M' + a[0].toFixed(1) + " " + a[1].toFixed(1) +
                " L" + b[0].toFixed(1) + " " + b[1].toFixed(1) + '"/>';
      (top[i][2] < 0 ? ribsF : ribsB).push(seg);
    }

    var hoopsF = mid.map(function (r) { return ringPaths(r, true); }).join("");
    var hoopsB = mid.map(function (r) { return ringPaths(r, false); }).join("");

    // the floor grid, seen through the mouth
    var floor = [];
    for (var fx = -1; fx <= 1.0001; fx += 2 / 14) {
      var a1 = project([fx * (BK.botHW - 0.06), 0, -(BK.botHD - 0.05)]);
      var b1 = project([fx * (BK.botHW - 0.06), 0,  (BK.botHD - 0.05)]);
      floor.push('<path d="M' + a1[0].toFixed(1) + " " + a1[1].toFixed(1) +
                 " L" + b1[0].toFixed(1) + " " + b1[1].toFixed(1) + '"/>');
    }
    for (var fz = -1; fz <= 1.0001; fz += 1) {
      var a2 = project([-(BK.botHW - 0.06), 0, fz * (BK.botHD - 0.05)]);
      var b2 = project([ (BK.botHW - 0.06), 0, fz * (BK.botHD - 0.05)]);
      floor.push('<path d="M' + a2[0].toFixed(1) + " " + a2[1].toFixed(1) +
                 " L" + b2[0].toFixed(1) + " " + b2[1].toFixed(1) + '"/>');
    }

    // Each handle folds up past centre, so the two cross above the middle
    // the way a real folding basket's do.
    var back =
      '<g ' + thinB + '>' + ribsB.join("") + hoopsB + '</g>' +
      '<g ' + thinB + ' opacity=".26">' + floor.join("") + '</g>' +
      '<g ' + railB + '>' + ringPaths(top, false) + ringPaths(base, false) + '</g>' +
      '<g ' + strapS + ' opacity=".45">' +
        handle(BK.topHD, -0.60, 1.16, 0.30, 0.062, 0.35) +
      '</g>';

    var front =
      '<g ' + thinF + '>' + ribsF.join("") + hoopsF + '</g>' +
      '<g ' + rail + '>' + ringPaths(top, true) + ringPaths(base, true) + '</g>' +
      // a highlight riding the top of the rim reads as round wire, not a flat line
      '<g ' + gleam + ' transform="translate(0,-1.5)">' + ringPaths(top, true) + '</g>' +
      '<g ' + strapS + '>' + handle(-BK.topHD, 0.60, 1.20, 0.30, 0.062, -0.35) + '</g>';

    document.getElementById("wireBack").innerHTML = back;
    document.getElementById("wireFront").innerHTML = front;
  }
  buildBasket();

  /* ---------- build the 2x2 grid inside the phone ---------- */
  var grid = document.getElementById("grid");
  var well = document.getElementById("well");
  var basket = document.getElementById("basket");
  var liveEl = document.getElementById("live");

  PRODUCTS.forEach(function (p, i) {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.index = String(i);
    card.setAttribute("aria-label", "Add " + p.brand + " " + p.name + " to cart");
    card.style.setProperty("--s", String(p.scale));
    card.innerHTML =
      '<span class="tile">' +
        '<span class="added">Added to cart</span>' +
        '<span class="shot">' + shotHTML(p) + '</span>' +
      '</span>' +
      '<span class="cta">Add to cart</span>';
    grid.appendChild(card);
  });

  /* ---------- add to basket ---------- */
  var added = 0;

  // slot centres across the basket mouth
  var LANES = [13, 37.5, 62, 86.5];

  function rest(n) {
    var lean = [-7, -2, 3, 8][n % 4];
    var lift = [0, -3, -1, -4][n % 4];
    return "translateX(-50%) rotate(" + lean + "deg) translateY(" + lift + "px)";
  }

  function place(i) {
    var p = PRODUCTS[i];
    var slot = document.createElement("span");
    slot.className = "slot";
    slot.innerHTML = shotHTML(p);
    slot.style.left = LANES[added % LANES.length] + "%";
    slot.style.setProperty("--s", String(p.scale));
    slot.style.setProperty("--ar", String(p.ar));
    slot.style.setProperty("--rest", rest(added));
    slot.style.transform = rest(added);
    slot.style.zIndex = String(10 - added);
    well.appendChild(slot);
    return slot;
  }

  function announce(p) {
    added += 1;
    liveEl.textContent = p.brand + " " + p.name + " added to cart. " +
      (added === 1 ? "1 vial in the basket." : added + " vials in the basket.");
  }

  function addToCart(card) {
    if (card.classList.contains("spent")) return;
    var i = Number(card.dataset.index);
    var p = PRODUCTS[i];

    card.classList.add("spent");
    card.disabled = true;
    card.setAttribute("aria-label", p.brand + " " + p.name + " — added to cart");

    var slot = place(i);

    if (reduced) { announce(p); return; }

    slot.style.visibility = "hidden";

    var from = card.querySelector(".shot img").getBoundingClientRect();
    var to = slot.getBoundingClientRect();

    var flier = document.createElement("div");
    flier.className = "flier";
    flier.innerHTML = shotHTML(p);
    flier.style.left = from.left + "px";
    flier.style.top = from.top + "px";
    flier.style.width = from.width + "px";
    flier.style.height = from.height + "px";
    document.body.appendChild(flier);

    var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    var scale = to.width / from.width;
    var apexY = dy * 0.42 - Math.max(60, Math.abs(dy) * 0.3);

    var anim = flier.animate([
      { transform: "translate(0,0) scale(1) rotate(0deg)" },
      { transform: "translate(" + (dx * 0.52) + "px," + apexY + "px) scale(" + (1 + scale) / 2 * 1.1 + ") rotate(-11deg)", offset: 0.52 },
      { transform: "translate(" + dx + "px," + dy + "px) scale(" + scale + ") rotate(4deg)" }
    ], { duration: 760, easing: "cubic-bezier(.42,0,.3,1)", fill: "forwards" });

    anim.finished.then(function () {
      flier.remove();
      slot.style.visibility = "";
      slot.classList.add("landing");
      basket.classList.remove("jolt");
      void basket.offsetWidth;
      basket.classList.add("jolt");
      announce(p);
    }).catch(function () {
      flier.remove();
      slot.style.visibility = "";
      announce(p);
    });
  }

  grid.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (card) addToCart(card);
  });

  document.getElementById("reset").addEventListener("click", function () {
    added = 0;
    well.innerHTML = "";
    liveEl.textContent = "Basket emptied.";
    Array.prototype.forEach.call(grid.querySelectorAll(".card"), function (card) {
      card.classList.remove("spent");
      card.disabled = false;
      var p = PRODUCTS[Number(card.dataset.index)];
      card.setAttribute("aria-label", "Add " + p.brand + " " + p.name + " to cart");
    });
  });

  /* ----------------------------------------------------------
     Oversized 8-bit pointing hand, drawn from a pixel map
     ---------------------------------------------------------- */
  var HAND = [
    "....OOOO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWOOO.....",
    "....OWWOWWOO...",
    "....OWWOWWOWWO.",
    "OOO.OWWOWWOWWO.",
    "OWWOOWWWWWWWWWO",
    "OWWWWWWWWWWWWWO",
    "OWWWWWWWWWWWWWO",
    ".OWWWWWWWWWWWWO",
    ".OWWWWWWWWWWWO.",
    "..OWWWWWWWWWWO.",
    "..OWWWWWWWWWWO.",
    "...OWWWWWWWWO..",
    "...OOOOOOOOOO.."
  ];
  var PAINT = { O: "#EA8B45", W: "#FFFFFF" };

  function handSVG() {
    var w = HAND[0].length, h = HAND.length, px = [];
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var ch = HAND[y][x];
        if (ch === ".") continue;
        px.push('<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + PAINT[ch] + '"/>');
      }
    }
    var body = px.join("");
    return '<svg viewBox="-1 -1 ' + (w + 2) + ' ' + (h + 2) + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' +
             '<g class="sprite">' +
               '<g transform="translate(0.5,0.5)" opacity=".4">' +
                 body.replace(/fill="#FFFFFF"/g, 'fill="#D2691E"').replace(/fill="#EA8B45"/g, 'fill="#D2691E"') +
               '</g>' + body +
             '</g></svg>';
  }

  var cursor = document.getElementById("cursor");
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    cursor.innerHTML = handSVG();
    document.body.classList.add("cursor-on");

    var tx = innerWidth / 2, ty = innerHeight / 2, cx = tx, cy = ty;
    (function loop() {
      cx += (tx - cx) * 0.4;
      cy += (ty - cy) * 0.4;
      cursor.style.transform = "translate3d(" + cx + "px," + cy + "px,0)";
      requestAnimationFrame(loop);
    })();

    addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      tx = e.clientX; ty = e.clientY;
      cursor.classList.add("ready");
    }, { passive: true });
    addEventListener("pointerdown", function () { cursor.classList.add("down"); }, { passive: true });
    addEventListener("pointerup", function () { cursor.classList.remove("down"); }, { passive: true });
    document.addEventListener("mouseleave", function () { cursor.classList.remove("ready"); });
    document.addEventListener("pointerover", function (e) {
      cursor.classList.toggle("over", !!e.target.closest(".card:not(.spent), .reset"));
    }, { passive: true });
  }

  addEventListener("resize", function () {
    Array.prototype.forEach.call(well.querySelectorAll(".slot"), function (slot, n) {
      slot.style.left = LANES[n % LANES.length] + "%";
    });
  }, { passive: true });
})();
</script>
</body>
</html>

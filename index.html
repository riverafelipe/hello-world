<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DecantX — Fill Your Basket</title>
<style>
  /* ============================================================
     DecantX — interactive "fill your basket" scene
     Design tokens. This page deliberately commits to a single
     warm-orange world (a lit perfume counter), so the palette is
     fixed rather than theme-reactive — the theme toggle must not
     wash it out, hence explicit values on both data-theme states.
     ============================================================ */
  :root,
  :root[data-theme="dark"],
  :root[data-theme="light"] {
    --ink:        #2B1607;  /* roasted brown-black, biased toward the accent */
    --ink-soft:   #6B4A2E;
    --ground:     #FFF1DE;  /* warm cream ground */
    --ground-2:   #FFE2BE;
    --orange:     #FF6A13;  /* the accent, spent here and nowhere else */
    --orange-deep:#D93E00;
    --amber:      #FFB03A;
    --muted:      #B9A08A;  /* warm-biased neutral for the spent state */
    --glass:      rgba(255, 255, 255, 0.62);

    --step--1: clamp(0.68rem, 0.62rem + 0.28vw, 0.8rem);
    --step-0:  clamp(0.86rem, 0.8rem + 0.3vw, 1rem);
    --step-1:  clamp(1.1rem, 0.95rem + 0.7vw, 1.5rem);
    /* the display size answers to viewport height as well as width, so the
       whole scene keeps fitting on a short laptop screen without scrolling */
    --step-3:  clamp(1.7rem, 1rem + 2vw + 0.7vh, 3.4rem);

    --display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --label:   ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    color-scheme: only light;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--display);
    color: var(--ink);
    background: var(--ground);
    overflow-x: hidden;
  }

  /* Ambient ground: a low sun behind the counter, plus a faint pixel grid
     that ties the scene to the 8-bit cursor. */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(120% 80% at 50% 18%, var(--amber) 0%, rgba(255,176,58,0) 58%),
      radial-gradient(90% 70% at 50% 108%, var(--orange) 0%, rgba(255,106,19,0) 60%),
      linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 100%);
  }
  .backdrop::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(43,22,7,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(43,22,7,.055) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(100% 75% at 50% 40%, #000 30%, transparent 78%);
  }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: clamp(0.6rem, 1.6vh, 1.4rem);
    padding: clamp(0.9rem, 2.2vh, 1.6rem) clamp(1rem, 4vw, 3rem) clamp(1rem, 2.4vh, 1.8rem);
  }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  /* Placeholder wordmark — swap the whole <a> for <img src="decantx-logo.svg">
     when the real asset is available. */
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    gap: 0.06em;
    font-size: clamp(1.35rem, 1rem + 1.6vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    color: var(--ink);
    text-decoration: none;
    line-height: 1;
  }
  .wordmark b { font-weight: 800; }
  .wordmark .x {
    color: var(--ground);
    background: var(--orange);
    padding: 0.1em 0.26em 0.16em;
    border-radius: 0.14em;
    margin-left: 0.12em;
    box-shadow: 0 3px 0 var(--orange-deep);
  }
  .wordmark small {
    display: block;
    font-family: var(--label);
    font-size: var(--step--1);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-left: 0.6em;
    align-self: center;
  }

  .counter {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--label);
    font-size: var(--step--1);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--glass);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 0.5rem 0.95rem;
    box-shadow: 0 3px 0 var(--ink);
  }
  .counter .n {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    background: var(--orange);
    color: var(--ground);
    border-radius: 999px;
    min-width: 1.9em;
    text-align: center;
    padding: 0.1em 0.4em;
  }
  .counter.bump { animation: bump 420ms cubic-bezier(.3,1.6,.4,1); }
  @keyframes bump { 40% { transform: scale(1.12) rotate(-2deg); } }

  /* ---------- hero / basket ---------- */
  .hero {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(0.6rem, 1.6vh, 1.4rem);
    text-align: center;
  }

  .kicker {
    font-family: var(--label);
    font-size: var(--step--1);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--orange-deep);
  }

  h1 {
    margin: 0;
    font-size: var(--step-3);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.92;
    text-wrap: balance;
    max-width: 16ch;
  }
  h1 em {
    font-style: normal;
    color: var(--orange-deep);
  }

  .lede {
    font-family: var(--display);
    font-size: var(--step-0);
    letter-spacing: 0;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  /* The basket is layered: back shell -> items well -> front weave band,
     so vials genuinely sit *inside* the basket rather than on top of it. */
  .basket {
    position: relative;
    width: clamp(170px, min(27vw, 32vh), 340px);
    aspect-ratio: 1 / 0.86;
    flex: none;
  }
  .basket svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .basket .shell  { z-index: 1; }
  .basket .well   { z-index: 2; }
  .basket .facade { z-index: 3; pointer-events: none; }

  .basket.jolt { animation: jolt 480ms cubic-bezier(.3,1.5,.4,1); }
  @keyframes jolt {
    30% { transform: translateY(5px) scale(1.045, 0.955); }
    60% { transform: translateY(-2px) scale(0.985, 1.015); }
  }

  .well {
    position: absolute;
    left: 16%;
    right: 16%;
    top: 20%;
    height: 30%;
    z-index: 2;
  }
  .well .slot {
    position: absolute;
    bottom: 0;
    width: 26%;
    aspect-ratio: 1 / 2.35;
    transform-origin: 50% 100%;
  }
  .well .slot svg { position: static; width: 100%; height: 100%; }
  .well .slot.landing { animation: land 460ms cubic-bezier(.25,1.5,.45,1); }
  @keyframes land {
    0%   { transform: var(--rest) scale(0.82); }
    55%  { transform: var(--rest) scale(1.07); }
    100% { transform: var(--rest) scale(1); }
  }

  /* ---------- product rail ---------- */
  .rail {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(0.6rem, 1.4vw, 1.1rem);
    width: min(1100px, 100%);
    margin: 0 auto;
    flex: none;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
    padding: clamp(0.7rem, 1.4vw, 1.1rem) 0.7rem clamp(0.75rem, 1.4vw, 1rem);
    background: var(--glass);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 5px 0 var(--ink);
    backdrop-filter: blur(6px);
    font: inherit;
    color: inherit;
    text-align: center;
    transition: transform 180ms ease, box-shadow 180ms ease, filter 420ms ease, opacity 420ms ease;
  }
  .card:not(.spent):hover,
  .card:not(.spent):focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 9px 0 var(--ink);
  }
  .card:focus-visible { outline: 3px solid var(--orange-deep); outline-offset: 4px; }
  .card:not(.spent):active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

  .card .vial { width: clamp(38px, min(4.6vw, 7vh), 62px); aspect-ratio: 1 / 2.35; }
  .card .vial svg { width: 100%; height: 100%; }

  .brand {
    font-family: var(--label);
    font-size: var(--step--1);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .name {
    font-size: var(--step-1);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-wrap: balance;
  }
  .meta {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-top: auto; /* keeps prices on a line when brand names wrap */
    font-family: var(--label);
    font-size: var(--step--1);
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .price { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* spent state */
  .card.spent {
    filter: grayscale(1);
    opacity: 0.42;
    box-shadow: 0 2px 0 var(--ink);
    transform: none;
    cursor: default;
  }
  .card.spent .stamp { opacity: 1; transform: translate(-50%, -50%) rotate(-9deg) scale(1); }

  .stamp {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-9deg) scale(1.5);
    opacity: 0;
    transition: opacity 260ms ease, transform 380ms cubic-bezier(.2,1.5,.4,1);
    font-family: var(--label);
    font-size: clamp(0.62rem, 0.5rem + 0.42vw, 0.86rem);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink);
    background: rgba(255, 241, 222, 0.9);
    border: 3px solid var(--ink);
    border-radius: 6px;
    padding: 0.42em 0.7em;
    pointer-events: none;
  }

  /* the vial in flight, basket-bound */
  .flier {
    position: fixed;
    z-index: 60;
    pointer-events: none;
    will-change: transform;
  }
  .flier svg { width: 100%; height: 100%; }

  /* ---------- footer ---------- */
  .footnote {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
    font-family: var(--label);
    font-size: var(--step--1);
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    text-align: center;
  }
  .reset {
    font: inherit;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 0.4em 1em;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }
  .reset:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
  .reset:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .reset:focus-visible { outline: 3px solid var(--orange-deep); outline-offset: 3px; }

  /* ---------- oversized 8-bit cursor ---------- */
  /* Only on true pointer devices; touch and keyboard users keep the native one. */
  @media (hover: hover) and (pointer: fine) {
    body.cursor-on,
    body.cursor-on * { cursor: none !important; }
  }
  #cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 112px;
    z-index: 90;
    pointer-events: none;
    opacity: 0;
    transition: opacity 160ms ease;
    /* hotspot: the fingertip. 15-wide grid in a 17-wide viewBox at 112px
       => 6.6px per pixel; fingertip centre sits 6.5 pixels in, 1 pixel down. */
    margin: -7px 0 0 -43px;
    filter: drop-shadow(0 6px 0 rgba(217, 62, 0, 0.32));
    will-change: transform;
  }
  #cursor.ready { opacity: 1; }
  #cursor svg { display: block; width: 100%; height: auto; }
  #cursor .sprite { transition: transform 90ms cubic-bezier(.3,1.4,.4,1); transform-origin: 38% 5%; }
  #cursor.down .sprite { transform: scale(0.86) translate(2px, 3px); }
  #cursor.over .sprite { transform: scale(1.06) rotate(-4deg); }
  #cursor.over.down .sprite { transform: scale(0.9) rotate(-4deg) translate(2px, 3px); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 780px) {
    .rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .basket { width: clamp(190px, 54vw, 260px); }
    #cursor { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="stage">
  <header class="masthead">
    <!-- Placeholder wordmark: replace with the real DecantX logo asset. -->
    <a class="wordmark" href="https://www.decantx.com/" target="_blank" rel="noopener">
      <b>Decant</b><span class="x">X</span>
      <small>Hand-decanted samples</small>
    </a>

    <p class="counter" id="counter">
      Basket
      <span class="n" id="count">0</span>
    </p>
  </header>

  <section class="hero">
    <p class="kicker">Pick four · try before the full bottle</p>
    <h1>Tap a vial. Watch it <em>drop in</em>.</h1>

    <div class="basket" id="basket">
      <svg class="shell" viewBox="0 0 300 258" aria-hidden="true">
        <defs>
          <linearGradient id="weave" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FF8A3D"/>
            <stop offset="1" stop-color="#D93E00"/>
          </linearGradient>
          <clipPath id="bodyClip">
            <path d="M40 88 H260 L236 226 A14 14 0 0 1 222 238 H78 A14 14 0 0 1 64 226 Z"/>
          </clipPath>
        </defs>

        <!-- basket body -->
        <path d="M40 88 H260 L236 226 A14 14 0 0 1 222 238 H78 A14 14 0 0 1 64 226 Z"
              fill="url(#weave)" stroke="#2B1607" stroke-width="6" stroke-linejoin="round"/>

        <!-- woven texture -->
        <g clip-path="url(#bodyClip)" opacity="0.5">
          <g stroke="#8A2600" stroke-width="4">
            <path d="M44 118 H256"/><path d="M48 148 H252"/>
            <path d="M52 178 H248"/><path d="M56 208 H244"/>
          </g>
          <g stroke="#FFC98A" stroke-width="3" opacity="0.75">
            <path d="M70 88 L62 238"/><path d="M110 88 L106 238"/>
            <path d="M150 88 L150 238"/><path d="M190 88 L194 238"/>
            <path d="M230 88 L238 238"/>
          </g>
        </g>

        <!-- mouth: basket interior, drawn behind the vials. Weave carries
             around the inside so it reads as a basket, not a hole. -->
        <defs>
          <clipPath id="mouthClip"><ellipse cx="150" cy="88" rx="110" ry="24"/></clipPath>
        </defs>
        <ellipse cx="150" cy="88" rx="110" ry="24" fill="#A83100"/>
        <g clip-path="url(#mouthClip)">
          <ellipse cx="150" cy="72" rx="104" ry="20" fill="#C24100"/>
          <g stroke="#8A2600" stroke-width="3" opacity=".55">
            <path d="M62 88 L70 66"/><path d="M106 96 L108 66"/>
            <path d="M150 98 L150 64"/><path d="M194 96 L192 66"/>
            <path d="M238 88 L230 66"/>
          </g>
        </g>
        <ellipse cx="150" cy="88" rx="110" ry="24" fill="none" stroke="#2B1607" stroke-width="6"/>
      </svg>

      <div class="well" id="well"></div>

      <svg class="facade" viewBox="0 0 300 258" aria-hidden="true">
        <!-- front lip: overlaps the vials so they read as sitting *in* the basket -->
        <path d="M40 88 A110 24 0 0 0 260 88 L256 110 A110 24 0 0 1 44 110 Z"
              fill="#FF8A3D" stroke="#2B1607" stroke-width="6" stroke-linejoin="round"/>
        <g stroke="#8A2600" stroke-width="3.5" opacity="0.55">
          <path d="M78 104 L77 96"/><path d="M110 110 L109 101"/>
          <path d="M150 112 L150 103"/><path d="M190 110 L191 101"/>
          <path d="M222 104 L223 96"/>
        </g>
      </svg>
    </div>

  </section>

  <section class="rail" id="rail" aria-label="Products"></section>

  <footer class="footnote">
    <span class="lede">Decanted into 2&nbsp;ml glass atomizers — about 30 sprays each.</span>
    <button class="reset" id="reset" type="button">Empty basket</button>
  </footer>
</main>

<div id="cursor" aria-hidden="true"></div>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ----------------------------------------------------------
     Products — real DecantX listings. Prices are the brand's
     2 ml price points on decantx.com.
     ---------------------------------------------------------- */
  var PRODUCTS = [
    { brand: "Creed",                     name: "Aventus",         conc: "EDP",  price: "$11.79", juice: "#7A4A22", cap: "#C9CDD2", url: "https://www.decantx.com/products/creed-aventus-eau-de-parfum-for-men" },
    { brand: "Parfums de Marly",          name: "Layton",          conc: "EDP",  price: "$9.79",  juice: "#D9A441", cap: "#E7C77A", url: "https://www.decantx.com/products/parfums-de-marly-layton-eau-de-parfum-for-men" },
    { brand: "Maison Francis Kurkdjian",  name: "Baccarat Rouge 540", conc: "EDP", price: "$9.89", juice: "#C43A4E", cap: "#E0B4B0", url: "https://www.decantx.com/products/maison-francis-kurkdjian-baccarat-rouge-540-eau-de-parfum-unisex" },
    { brand: "Parfums de Marly",          name: "Layton Exclusif", conc: "EDP",  price: "$9.79",  juice: "#8C5A1E", cap: "#E7C77A", url: "https://www.decantx.com/products/parfums-de-marly-layton-exclusif-eau-de-parfum-for-men" }
  ];

  /* ----------------------------------------------------------
     Vial artwork. A DecantX decant is a small glass atomizer,
     so that — not a replica of the house's own flacon — is what
     ships in the basket. Transparent background by construction.
     ---------------------------------------------------------- */
  function vialSVG(p, i) {
    var gid = "g" + i, jid = "j" + i;
    return '' +
      '<svg viewBox="0 0 60 141" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
          '<linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="0">' +
            '<stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>' +
            '<stop offset=".38" stop-color="#ffffff" stop-opacity=".16"/>' +
            '<stop offset="1" stop-color="#2B1607" stop-opacity=".18"/>' +
          '</linearGradient>' +
          '<linearGradient id="' + jid + '" x1="0" y1="0" x2="1" y2="0">' +
            '<stop offset="0" stop-color="' + p.juice + '" stop-opacity=".72"/>' +
            '<stop offset=".45" stop-color="' + p.juice + '"/>' +
            '<stop offset="1" stop-color="' + p.juice + '" stop-opacity=".78"/>' +
          '</linearGradient>' +
          '<clipPath id="c' + i + '">' +
            '<rect x="11" y="40" width="38" height="94" rx="8"/>' +
          '</clipPath>' +
        '</defs>' +

        /* spray actuator */
        '<rect x="22" y="4"  width="16" height="13" rx="3" fill="' + p.cap + '" stroke="#2B1607" stroke-width="3"/>' +
        '<rect x="18" y="15" width="24" height="10" rx="3" fill="' + p.cap + '" stroke="#2B1607" stroke-width="3"/>' +
        /* collar */
        '<rect x="16" y="25" width="28" height="9" rx="2.5" fill="#EFE3D2" stroke="#2B1607" stroke-width="3"/>' +
        /* neck */
        '<rect x="20" y="33" width="20" height="9" fill="#F7EFE2" stroke="#2B1607" stroke-width="3"/>' +

        /* glass body */
        '<rect x="11" y="40" width="38" height="94" rx="8" fill="#FFFFFF" fill-opacity=".30" stroke="#2B1607" stroke-width="3"/>' +
        /* juice */
        '<g clip-path="url(#c' + i + ')">' +
          '<rect x="11" y="62" width="38" height="72" fill="url(#' + jid + ')"/>' +
          '<ellipse cx="30" cy="62" rx="19" ry="4.5" fill="' + p.juice + '" fill-opacity=".55"/>' +
          /* dip tube */
          '<rect x="28" y="46" width="4" height="80" rx="2" fill="#2B1607" fill-opacity=".22"/>' +
        '</g>' +
        /* glass sheen */
        '<rect x="11" y="40" width="38" height="94" rx="8" fill="url(#' + gid + ')"/>' +
        '<rect x="16" y="48" width="5" height="60" rx="2.5" fill="#FFFFFF" fill-opacity=".55"/>' +

        /* label band */
        '<rect x="8" y="86" width="44" height="30" rx="3" fill="#FFF6EA" stroke="#2B1607" stroke-width="3"/>' +
        '<rect x="12" y="92" width="36" height="3.4" rx="1.7" fill="#2B1607" fill-opacity=".68"/>' +
        '<rect x="12" y="99" width="26" height="3" rx="1.5" fill="#2B1607" fill-opacity=".38"/>' +
        '<rect x="12" y="105" width="31" height="3" rx="1.5" fill="#2B1607" fill-opacity=".26"/>' +
        /* accent tick — the one spot of brand orange on the vial */
        '<rect x="12" y="110.5" width="9" height="3" rx="1.5" fill="#FF6A13"/>' +

        '<rect x="11" y="40" width="38" height="94" rx="8" fill="none" stroke="#2B1607" stroke-width="3"/>' +
      '</svg>';
  }

  /* ----------------------------------------------------------
     Build the product rail
     ---------------------------------------------------------- */
  var rail = document.getElementById("rail");
  var well = document.getElementById("well");
  var basket = document.getElementById("basket");
  var countEl = document.getElementById("count");
  var counterEl = document.getElementById("counter");
  var liveEl = document.getElementById("live");

  PRODUCTS.forEach(function (p, i) {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.index = String(i);
    card.setAttribute("aria-label", "Add " + p.brand + " " + p.name + ", " + p.price + ", to basket");
    card.innerHTML =
      '<span class="vial">' + vialSVG(p, i) + '</span>' +
      '<span class="brand">' + p.brand + '</span>' +
      '<span class="name">' + p.name + '</span>' +
      '<span class="meta"><span class="price">' + p.price + '</span><span>' + p.conc + ' · 2 ml</span></span>' +
      '<span class="stamp">Added to cart</span>';
    rail.appendChild(card);
  });

  /* ----------------------------------------------------------
     Add to basket
     ---------------------------------------------------------- */
  var added = 0;

  function slotTransform(n) {
    // fan the vials across the mouth of the basket, back row first
    var lean = [-9, -3, 4, 10][n % 4];
    var lift = [0, -4, -2, -6][n % 4];
    return "rotate(" + lean + "deg) translateY(" + lift + "px)";
  }

  function place(i) {
    var p = PRODUCTS[i];
    var slot = document.createElement("span");
    slot.className = "slot";
    slot.innerHTML = vialSVG(p, "b" + i);
    slot.style.left = (4 + added * 22) + "%";
    slot.style.setProperty("--rest", slotTransform(added));
    slot.style.transform = slotTransform(added);
    slot.style.zIndex = String(10 - added);
    well.appendChild(slot);
    return slot;
  }

  function announce(p) {
    added += 1;
    countEl.textContent = String(added);
    counterEl.classList.remove("bump");
    void counterEl.offsetWidth;
    counterEl.classList.add("bump");
    liveEl.textContent = p.brand + " " + p.name + " added to cart. " +
      (added === 1 ? "1 vial in the basket." : added + " vials in the basket.");
  }

  function addToCart(card) {
    if (card.classList.contains("spent")) return;
    var i = Number(card.dataset.index);
    var p = PRODUCTS[i];

    card.classList.add("spent");
    card.disabled = true;
    card.setAttribute("aria-label", p.brand + " " + p.name + " — added to cart");

    var slot = place(i);

    if (reduced) {
      announce(p);
      return;
    }

    // hide the landed vial until the flier arrives
    slot.style.visibility = "hidden";

    var from = card.querySelector(".vial").getBoundingClientRect();
    var to = slot.getBoundingClientRect();

    var flier = document.createElement("div");
    flier.className = "flier";
    flier.innerHTML = vialSVG(p, "f" + i + "-" + added);
    flier.style.left = from.left + "px";
    flier.style.top = from.top + "px";
    flier.style.width = from.width + "px";
    flier.style.height = from.height + "px";
    document.body.appendChild(flier);

    var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    var scale = to.width / from.width;
    var apexY = dy * 0.35 - Math.max(90, Math.abs(dy) * 0.42);

    var anim = flier.animate(
      [
        { transform: "translate(0px, 0px) scale(1) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + dx * 0.5 + "px, " + apexY + "px) scale(" + (1.14 * (1 + scale) / 2 + 0.1) + ") rotate(-14deg)", offset: 0.5, opacity: 1 },
        { transform: "translate(" + dx + "px, " + dy + "px) scale(" + scale + ") rotate(6deg)", opacity: 1 }
      ],
      { duration: 720, easing: "cubic-bezier(.42,0,.3,1)", fill: "forwards" }
    );

    anim.finished.then(function () {
      flier.remove();
      slot.style.visibility = "";
      slot.classList.add("landing");
      basket.classList.remove("jolt");
      void basket.offsetWidth;
      basket.classList.add("jolt");
      announce(p);
    }).catch(function () {
      flier.remove();
      slot.style.visibility = "";
      announce(p);
    });
  }

  rail.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (card) addToCart(card);
  });

  document.getElementById("reset").addEventListener("click", function () {
    added = 0;
    well.innerHTML = "";
    countEl.textContent = "0";
    liveEl.textContent = "Basket emptied.";
    Array.prototype.forEach.call(rail.querySelectorAll(".card"), function (card) {
      card.classList.remove("spent");
      card.disabled = false;
      var p = PRODUCTS[Number(card.dataset.index)];
      card.setAttribute("aria-label", "Add " + p.brand + " " + p.name + ", " + p.price + ", to basket");
    });
  });

  /* ----------------------------------------------------------
     Oversized 8-bit pointing hand
     Drawn from a pixel map rather than hand-authored path data,
     so the sprite stays editable.
     ---------------------------------------------------------- */
  var HAND = [
    "....OOOO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWOOO.....",
    "....OWWOWWOO...",
    "....OWWOWWOWWO.",
    "OOO.OWWOWWOWWO.",
    "OWWOOWWWWWWWWWO",
    "OWWWWWWWWWWWWWO",
    "OWWWWWWWWWWWWWO",
    ".OWWWWWWWWWWWWO",
    ".OWWWWWWWWWWWO.",
    "..OWWWWWWWWWWO.",
    "..OWWWWWWWWWWO.",
    "...OWWWWWWWWO..",
    "...OOOOOOOOOO.."
  ];
  var PAINT = { O: "#FF6A13", W: "#FFF6EA", s: "#FFB03A" };

  function handSVG() {
    var w = HAND[0].length, h = HAND.length, px = [];
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var ch = HAND[y][x];
        if (ch === ".") continue;
        px.push('<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + PAINT[ch] + '"/>');
      }
    }
    // A second, offset pass in the deep orange reads as the outline's own shadow.
    return '<svg viewBox="-1 -1 ' + (w + 2) + ' ' + (h + 2) + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' +
             '<g class="sprite">' +
               '<g transform="translate(0.55,0.55)" opacity=".45">' +
                 px.join("").replace(/fill="#FFF6EA"/g, 'fill="#D93E00"').replace(/fill="#FF6A13"/g, 'fill="#D93E00"') +
               '</g>' +
               px.join("") +
             '</g>' +
           '</svg>';
  }

  var cursor = document.getElementById("cursor");
  var fine = window.matchMedia("(hover: hover) and (pointer: fine)");

  if (fine.matches) {
    cursor.innerHTML = handSVG();
    document.body.classList.add("cursor-on");

    var tx = window.innerWidth / 2, ty = window.innerHeight / 2;
    var cx = tx, cy = ty, raf = 0;

    function loop() {
      // a touch of lag gives the sprite weight without feeling laggy to click
      cx += (tx - cx) * 0.38;
      cy += (ty - cy) * 0.38;
      cursor.style.transform = "translate3d(" + cx + "px," + cy + "px,0)";
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    window.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      tx = e.clientX;
      ty = e.clientY;
      cursor.classList.add("ready");
    }, { passive: true });

    window.addEventListener("pointerdown", function () { cursor.classList.add("down"); }, { passive: true });
    window.addEventListener("pointerup", function () { cursor.classList.remove("down"); }, { passive: true });
    document.addEventListener("mouseleave", function () { cursor.classList.remove("ready"); });

    document.addEventListener("pointerover", function (e) {
      var hot = e.target.closest(".card:not(.spent), .reset, a");
      cursor.classList.toggle("over", !!hot);
    }, { passive: true });
  }

  // keep the basket contents aligned if the viewport changes mid-scene
  window.addEventListener("resize", function () {
    Array.prototype.forEach.call(well.querySelectorAll(".slot"), function (slot, n) {
      slot.style.left = (4 + n * 22) + "%";
    });
  }, { passive: true });
})();
</script>
</body>
</html>

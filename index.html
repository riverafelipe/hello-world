<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DecantX — Payday Essentials</title>
<style>
  /* ============================================================
     DecantX "Payday Essentials" — a 9:16 social poster.
     A wire market basket sits over a phone mockup; tapping a tile
     inside the phone flies that product up into the basket.
     Orange restatement of the pink reference.
     ============================================================ */
  :root,
  :root[data-theme="dark"],
  :root[data-theme="light"] {
    --cream:       #FAF3EB;  /* the poster ground */
    --cream-deep:  #F2E7DA;
    --tile:        #F1ECE5;  /* product tile fill inside the phone */
    --orange-pale: #F7CDA8;  /* spent / greyed-out state */
    --orange-soft: #F0A96E;  /* title, wire highlights */
    --orange:      #EA8B45;  /* the basket wire */
    --orange-deep: #D2691E;  /* "ADD TO CART", the one strong note */
    --ink:         #3A2A1E;
    --ink-soft:    #8A7563;

    --serif: "Didot", "Bodoni MT", "Playfair Display", "Hoefler Text", Garamond, Georgia, "Times New Roman", serif;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;

    color-scheme: only light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--cream-deep);
    color: var(--ink);
    font-family: var(--sans);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ---------- the poster ---------- */
  .poster {
    position: relative;
    container-type: size;
    width: min(100vw, 56.25dvh);   /* 9:16 */
    height: min(177.78vw, 100dvh);
    background: var(--cream);
    overflow: hidden;
    isolation: isolate;
  }

  /* ---------- title ---------- */
  .title {
    position: absolute;
    top: 6.4%;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-family: var(--serif);
    font-size: 7.4cqw;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.06em;
    color: var(--orange-soft);
    white-space: nowrap;
  }
  .title em { font-style: italic; letter-spacing: 0.02em; }

  /* ---------- wire basket ---------- */
  .basket {
    position: absolute;
    left: 50%;
    top: 15%;
    width: 76cqw;
    transform: translateX(-50%);
    aspect-ratio: 400 / 250;
    z-index: 3;                    /* over the phone */
  }
  .basket > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .basket .wire-back  { z-index: 1; }
  .basket .well       { z-index: 2; }
  .basket .wire-front { z-index: 3; pointer-events: none; }

  .basket.jolt { animation: jolt 520ms cubic-bezier(.3,1.5,.4,1); }
  @keyframes jolt {
    30% { transform: translateX(-50%) translateY(4px) scale(1.028, 0.972); }
    65% { transform: translateX(-50%) translateY(-2px) scale(0.99, 1.01); }
  }

  .well {
    /* the basket interior: vials stand on the base and rise past the rim */
    position: absolute;
    left: 20%;
    right: 20%;
    bottom: 16%;
    height: 50%;
    z-index: 2;
  }
  .well .slot {
    position: absolute;
    bottom: 0;
    width: 22%;
    height: 100%;
    transform-origin: 50% 100%;
  }
  .well .slot svg { width: 100%; height: 100%; display: block; }
  .well .slot.landing { animation: land 460ms cubic-bezier(.25,1.5,.45,1); }
  @keyframes land {
    0%   { transform: var(--rest) scale(0.84); }
    55%  { transform: var(--rest) scale(1.06); }
    100% { transform: var(--rest) scale(1); }
  }

  /* ---------- phone ---------- */
  .phone {
    position: absolute;
    left: 50%;
    top: 40.5%;
    transform: translateX(-50%);
    width: 72cqw;
    height: 68cqh;               /* runs off the bottom edge, as in the reference */
    background: #FFFFFF;
    border: 0.9cqw solid #EFE9E1;
    border-radius: 7cqw 7cqw 0 0;
    box-shadow: 0 1.4cqw 3.4cqw rgba(58, 42, 30, 0.10);
    z-index: 2;
    overflow: hidden;
  }
  /* side buttons */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    right: -1.3cqw;
    width: 0.9cqw;
    border-radius: 0 1cqw 1cqw 0;
    background: #EFE9E1;
  }
  .phone::before { top: 15%; height: 9%; }
  .phone::after  { top: 27%; height: 5%; }

  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.6cqw 4.4cqw 0;
    font-family: var(--sans);
    font-size: 2.3cqw;
    font-weight: 600;
    color: var(--ink);
  }
  .island {
    width: 15cqw;
    height: 3.4cqw;
    border-radius: 999px;
    background: #26201A;
    position: relative;
  }
  .island::after {
    content: "";
    position: absolute;
    right: 1cqw;
    top: 50%;
    transform: translateY(-50%);
    width: 1.5cqw;
    height: 1.5cqw;
    border-radius: 50%;
    background: #3E362E;
  }
  .statusbar .sig { display: flex; align-items: center; gap: 0.8cqw; }
  .statusbar .sig svg { height: 2.4cqw; width: auto; display: block; }

  /* in-phone header */
  .appbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 2.6cqw 4.4cqw 1.8cqw;
  }
  .appbar .icon { width: 4.4cqw; color: var(--ink); }
  .appbar .icon svg { width: 100%; height: auto; display: block; }
  .appbar .cart { justify-self: end; }

  /* Placeholder wordmark — swap this <span> for the real DecantX logo. */
  .logo {
    font-family: var(--serif);
    font-size: 4.4cqw;
    letter-spacing: 0.02em;
    color: var(--orange-soft);
    white-space: nowrap;
    line-height: 1;
  }
  .logo em { font-style: italic; }

  .rule {
    height: 0.28cqw;
    margin: 0 4.4cqw;
    background: var(--cream-deep);
  }

  /* ---------- product grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3.4cqw 3cqw;
    padding: 3.4cqw 4.4cqw;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5cqw;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
  }
  .card:focus-visible { outline: 0.5cqw solid var(--orange-deep); outline-offset: 0.6cqw; }

  .tile {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.16;
    background: var(--tile);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .tile .vial {
    width: 36%;
    transition: opacity 420ms ease, filter 420ms ease;
  }
  .tile .vial svg { width: 100%; height: auto; display: block; }

  /* "ADDED TO CART" sits at the top of the tile, per the reference */
  .tile .added {
    position: absolute;
    top: 7%;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--serif);
    font-size: 2.1cqw;
    font-style: italic;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    transition: opacity 300ms ease 120ms;
    pointer-events: none;
  }

  .cta {
    font-family: var(--serif);
    font-style: italic;
    font-size: 2.7cqw;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--orange-deep);
    transition: color 420ms ease;
  }

  .card:not(.spent):hover .tile .vial { transform: scale(1.04); }
  .tile .vial { transition: opacity 420ms ease, filter 420ms ease, transform 260ms ease; }

  /* spent state: product ghosts out, label pales, "ADDED TO CART" appears */
  .card.spent .tile .vial { opacity: 0.26; filter: grayscale(0.55); }
  .card.spent .tile .added { opacity: 1; }
  .card.spent .cta { color: var(--orange-pale); }

  /* the vial in flight, basket-bound */
  .flier {
    position: fixed;
    z-index: 60;
    pointer-events: none;
    will-change: transform;
  }
  .flier svg { width: 100%; height: 100%; display: block; }

  /* ---------- reset ---------- */
  .reset {
    position: absolute;
    right: 3cqw;
    top: 2.6cqw;
    z-index: 8;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.9cqw;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: transparent;
    border: 0.18cqw solid var(--orange-pale);
    border-radius: 999px;
    padding: 0.5cqw 1.4cqw;
    opacity: 0.4;
    transition: opacity 180ms ease, border-color 180ms ease;
  }
  .reset:hover { opacity: 1; border-color: var(--orange-soft); }
  .reset:focus-visible { outline: 0.4cqw solid var(--orange-deep); outline-offset: 0.4cqw; }

  /* ---------- oversized 8-bit cursor ---------- */
  @media (hover: hover) and (pointer: fine) {
    body.cursor-on, body.cursor-on * { cursor: none !important; }
  }
  #cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 104px;
    z-index: 90;
    pointer-events: none;
    opacity: 0;
    transition: opacity 160ms ease;
    /* hotspot: the fingertip. 15-wide grid in a 17-wide viewBox at 104px
       => 6.1px per pixel; the fingertip centre is 6.5 px in and 1 px down. */
    margin: -6px 0 0 -40px;
    filter: drop-shadow(0 5px 0 rgba(210, 105, 30, 0.28));
    will-change: transform;
  }
  #cursor.ready { opacity: 1; }
  #cursor svg { display: block; width: 100%; height: auto; }
  #cursor .sprite { transition: transform 90ms cubic-bezier(.3,1.4,.4,1); transform-origin: 38% 5%; }
  #cursor.down .sprite { transform: scale(0.86) translate(2px, 3px); }
  #cursor.over .sprite { transform: scale(1.07) rotate(-4deg); }
  #cursor.over.down .sprite { transform: scale(0.9) rotate(-4deg) translate(2px, 3px); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (hover: none), (pointer: coarse) {
    #cursor { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="poster" id="poster">
  <h1 class="title">PAYDAY <em>ESSENTIALS</em></h1>

  <button class="reset" id="reset" type="button">Reset</button>

  <!-- wire basket: back wires, then the items well, then front wires -->
  <div class="basket" id="basket">
    <svg class="wire-back"  id="wireBack"  viewBox="0 0 400 250" aria-hidden="true"></svg>
    <div class="well" id="well"></div>
    <svg class="wire-front" id="wireFront" viewBox="0 0 400 250" aria-hidden="true"></svg>
  </div>

  <!-- phone mockup -->
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="island"></span>
      <span class="sig">
        <svg viewBox="0 0 20 14" fill="currentColor" aria-hidden="true"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/></svg>
        <svg viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1 5a12 12 0 0 1 16 0"/><path d="M4 8.4a7.5 7.5 0 0 1 10 0"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 26 13" fill="none" aria-hidden="true"><rect x="0.8" y="0.8" width="21" height="11.4" rx="3" stroke="currentColor" stroke-width="1.4"/><rect x="2.6" y="2.6" width="17.4" height="7.8" rx="1.6" fill="currentColor"/><path d="M23.6 4.6v3.8a2.4 2.4 0 0 0 0-3.8z" fill="currentColor"/></svg>
      </span>
    </div>

    <div class="appbar">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1 1.5h20M1 8h20M1 14.5h20"/></svg>
      </span>
      <!-- Placeholder wordmark: replace with the real DecantX logo asset. -->
      <span class="logo">DECANT<em>X</em></span>
      <span class="icon cart" aria-hidden="true">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.6h3.1l2.6 12.1h10.4l2.3-8.6H5.6"/><circle cx="8.4" cy="19" r="1.7"/><circle cx="16.4" cy="19" r="1.7"/></svg>
      </span>
    </div>
    <div class="rule"></div>

    <div class="grid" id="grid" aria-label="Products"></div>
  </div>
</div>

<div id="cursor" aria-hidden="true"></div>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Real DecantX listings, at the brand's 2 ml price points. */
  var PRODUCTS = [
    { brand: "Creed",                    name: "Aventus",            juice: "#8A5A2B", cap: "#D8DCE0" },
    { brand: "Parfums de Marly",         name: "Layton",             juice: "#D9A441", cap: "#EBD298" },
    { brand: "Maison Francis Kurkdjian", name: "Baccarat Rouge 540", juice: "#C8546A", cap: "#E9C2BE" },
    { brand: "Parfums de Marly",         name: "Layton Exclusif",    juice: "#96601F", cap: "#EBD298" }
  ];

  /* ----------------------------------------------------------
     Wire basket, generated rather than hand-authored so the
     mesh stays adjustable. Back half of every hoop goes behind
     the vials, front half in front — that's what sells "inside".
     ---------------------------------------------------------- */
  /* The basket is a rectangular frustum. Corners, front (near) and
     back (far) rings — everything else is interpolated from these. */
  var TLb = [58, 100],  TRb = [342, 100];   // back rim
  var TL  = [24, 142],  TR  = [376, 142];   // front rim
  var BLb = [92, 200],  BRb = [308, 200];   // back base
  var BL  = [66, 236],  BR  = [334, 236];   // front base

  function lerp(p, q, t) { return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]; }
  function line(p, q) {
    return '<path d="M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) +
           ' L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1) + '"/>';
  }

  /* Wire mesh across a quad, corners given clockwise from top-left. */
  function mesh(a, b, c, d, nv, nh) {
    var out = [], i;
    for (i = 0; i <= nv; i++) out.push(line(lerp(a, b, i / nv), lerp(d, c, i / nv)));
    for (i = 0; i <= nh; i++) out.push(line(lerp(a, d, i / nh), lerp(b, c, i / nh)));
    return out.join("");
  }

  function quad(a, b, c, d) {
    return '<path d="M' + a + ' L' + b + ' L' + c + ' L' + d + ' Z"/>';
  }

  function buildBasket() {
    var wire  = 'fill="none" stroke="var(--orange)" stroke-width="3" stroke-linecap="round"';
    var frame = 'fill="none" stroke="var(--orange)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';

    // BACK: far wall seen through the mesh, far rim edge, and the two
    // folding handles — handles belong behind the vials, or they read
    // as tangled over them.
    var back =
      '<g ' + wire + ' opacity=".35">' + mesh(TLb, TRb, BRb, BLb, 11, 3) + '</g>' +
      '<g ' + frame + ' opacity=".55">' + line(TLb, TRb) + line(BLb, BRb) + '</g>' +
      // each handle is a strap hinged on one side, swinging up and across
      // so the two cross near the apex
      '<g ' + wire + ' stroke-width="4" stroke-linejoin="round">' +
        '<path d="M144 144 C138 86 166 38 202 28 L210 42 C180 52 158 96 160 144 Z"/>' +
        '<path d="M256 144 C262 86 234 38 198 28 L190 42 C220 52 242 96 240 144 Z"/>' +
      '</g>';

    // FRONT: near wall + both side walls + rim opening + base + handles
    var front =
      '<g ' + wire + '>' +
        mesh(TL, TR, BR, BL, 13, 3) +          // front wall
        mesh(TLb, TL, BL, BLb, 3, 3) +         // left wall
        mesh(TRb, TR, BR, BRb, 3, 3) +         // right wall
      '</g>' +
      '<g ' + frame + '>' +
        quad(TLb, TRb, TR, TL) +               // the mouth
        quad(TL, TR, BR, BL) +                 // front wall frame
        line(BL, BLb) + line(BR, BRb) +
      '</g>';

    document.getElementById("wireBack").innerHTML = back;
    document.getElementById("wireFront").innerHTML = front;
  }
  buildBasket();

  /* ----------------------------------------------------------
     Vial artwork — a DecantX decant is a small glass atomizer,
     so that is what ships in the basket. Transparent by build.
     ---------------------------------------------------------- */
  function vialSVG(p, key) {
    var g = "g" + key, j = "j" + key, c = "c" + key;
    return '' +
      '<svg viewBox="0 0 60 141" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
          '<linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="0">' +
            '<stop offset="0" stop-color="#fff" stop-opacity=".9"/>' +
            '<stop offset=".38" stop-color="#fff" stop-opacity=".18"/>' +
            '<stop offset="1" stop-color="#3A2A1E" stop-opacity=".14"/>' +
          '</linearGradient>' +
          '<linearGradient id="' + j + '" x1="0" y1="0" x2="1" y2="0">' +
            '<stop offset="0" stop-color="' + p.juice + '" stop-opacity=".72"/>' +
            '<stop offset=".45" stop-color="' + p.juice + '"/>' +
            '<stop offset="1" stop-color="' + p.juice + '" stop-opacity=".8"/>' +
          '</linearGradient>' +
          '<clipPath id="' + c + '"><rect x="11" y="40" width="38" height="94" rx="8"/></clipPath>' +
        '</defs>' +
        '<rect x="22" y="4"  width="16" height="13" rx="3" fill="' + p.cap + '" stroke="#3A2A1E" stroke-width="2.4"/>' +
        '<rect x="18" y="15" width="24" height="10" rx="3" fill="' + p.cap + '" stroke="#3A2A1E" stroke-width="2.4"/>' +
        '<rect x="16" y="25" width="28" height="9" rx="2.5" fill="#F3EAE0" stroke="#3A2A1E" stroke-width="2.4"/>' +
        '<rect x="20" y="33" width="20" height="9" fill="#F9F3EB" stroke="#3A2A1E" stroke-width="2.4"/>' +
        '<rect x="11" y="40" width="38" height="94" rx="8" fill="#fff" fill-opacity=".34" stroke="#3A2A1E" stroke-width="2.4"/>' +
        '<g clip-path="url(#' + c + ')">' +
          '<rect x="11" y="62" width="38" height="72" fill="url(#' + j + ')"/>' +
          '<ellipse cx="30" cy="62" rx="19" ry="4.5" fill="' + p.juice + '" fill-opacity=".55"/>' +
          '<rect x="28" y="46" width="4" height="80" rx="2" fill="#3A2A1E" fill-opacity=".2"/>' +
        '</g>' +
        '<rect x="11" y="40" width="38" height="94" rx="8" fill="url(#' + g + ')"/>' +
        '<rect x="16" y="48" width="5" height="58" rx="2.5" fill="#fff" fill-opacity=".6"/>' +
        '<rect x="8" y="86" width="44" height="30" rx="3" fill="#FDF8F2" stroke="#3A2A1E" stroke-width="2.4"/>' +
        '<rect x="12" y="92"   width="36" height="3.2" rx="1.6" fill="#3A2A1E" fill-opacity=".62"/>' +
        '<rect x="12" y="98.6" width="26" height="2.8" rx="1.4" fill="#3A2A1E" fill-opacity=".34"/>' +
        '<rect x="12" y="104.6" width="31" height="2.8" rx="1.4" fill="#3A2A1E" fill-opacity=".24"/>' +
        '<rect x="12" y="110.2" width="9"  height="2.8" rx="1.4" fill="#D2691E"/>' +
        '<rect x="11" y="40" width="38" height="94" rx="8" fill="none" stroke="#3A2A1E" stroke-width="2.4"/>' +
      '</svg>';
  }

  /* ---------- build the 2x2 grid inside the phone ---------- */
  var grid = document.getElementById("grid");
  var well = document.getElementById("well");
  var basket = document.getElementById("basket");
  var liveEl = document.getElementById("live");

  PRODUCTS.forEach(function (p, i) {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.index = String(i);
    card.setAttribute("aria-label", "Add " + p.brand + " " + p.name + " to cart");
    card.innerHTML =
      '<span class="tile">' +
        '<span class="added">Added to cart</span>' +
        '<span class="vial">' + vialSVG(p, i) + '</span>' +
      '</span>' +
      '<span class="cta">Add to cart</span>';
    grid.appendChild(card);
  });

  /* ---------- add to basket ---------- */
  var added = 0;

  function rest(n) {
    var lean = [-7, -2, 3, 8][n % 4];
    var lift = [0, -3, -1, -4][n % 4];
    return "rotate(" + lean + "deg) translateY(" + lift + "px)";
  }

  function place(i) {
    var slot = document.createElement("span");
    slot.className = "slot";
    slot.innerHTML = vialSVG(PRODUCTS[i], "b" + i);
    slot.style.left = (4 + added * 23) + "%";
    slot.style.setProperty("--rest", rest(added));
    slot.style.transform = rest(added);
    slot.style.zIndex = String(10 - added);
    well.appendChild(slot);
    return slot;
  }

  function announce(p) {
    added += 1;
    liveEl.textContent = p.brand + " " + p.name + " added to cart. " +
      (added === 1 ? "1 vial in the basket." : added + " vials in the basket.");
  }

  function addToCart(card) {
    if (card.classList.contains("spent")) return;
    var i = Number(card.dataset.index);
    var p = PRODUCTS[i];

    card.classList.add("spent");
    card.disabled = true;
    card.setAttribute("aria-label", p.brand + " " + p.name + " — added to cart");

    var slot = place(i);

    if (reduced) { announce(p); return; }

    slot.style.visibility = "hidden";

    var from = card.querySelector(".vial").getBoundingClientRect();
    var to = slot.getBoundingClientRect();

    var flier = document.createElement("div");
    flier.className = "flier";
    flier.innerHTML = vialSVG(p, "f" + i + "-" + added);
    flier.style.left = from.left + "px";
    flier.style.top = from.top + "px";
    flier.style.width = from.width + "px";
    flier.style.height = from.height + "px";
    document.body.appendChild(flier);

    var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    var scale = to.width / from.width;
    var apexY = dy * 0.42 - Math.max(60, Math.abs(dy) * 0.3);

    var anim = flier.animate([
      { transform: "translate(0,0) scale(1) rotate(0deg)" },
      { transform: "translate(" + (dx * 0.52) + "px," + apexY + "px) scale(" + (1 + scale) / 2 * 1.1 + ") rotate(-11deg)", offset: 0.52 },
      { transform: "translate(" + dx + "px," + dy + "px) scale(" + scale + ") rotate(4deg)" }
    ], { duration: 760, easing: "cubic-bezier(.42,0,.3,1)", fill: "forwards" });

    anim.finished.then(function () {
      flier.remove();
      slot.style.visibility = "";
      slot.classList.add("landing");
      basket.classList.remove("jolt");
      void basket.offsetWidth;
      basket.classList.add("jolt");
      announce(p);
    }).catch(function () {
      flier.remove();
      slot.style.visibility = "";
      announce(p);
    });
  }

  grid.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (card) addToCart(card);
  });

  document.getElementById("reset").addEventListener("click", function () {
    added = 0;
    well.innerHTML = "";
    liveEl.textContent = "Basket emptied.";
    Array.prototype.forEach.call(grid.querySelectorAll(".card"), function (card) {
      card.classList.remove("spent");
      card.disabled = false;
      var p = PRODUCTS[Number(card.dataset.index)];
      card.setAttribute("aria-label", "Add " + p.brand + " " + p.name + " to cart");
    });
  });

  /* ----------------------------------------------------------
     Oversized 8-bit pointing hand, drawn from a pixel map
     ---------------------------------------------------------- */
  var HAND = [
    "....OOOO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWO.......",
    "....OWWOOO.....",
    "....OWWOWWOO...",
    "....OWWOWWOWWO.",
    "OOO.OWWOWWOWWO.",
    "OWWOOWWWWWWWWWO",
    "OWWWWWWWWWWWWWO",
    "OWWWWWWWWWWWWWO",
    ".OWWWWWWWWWWWWO",
    ".OWWWWWWWWWWWO.",
    "..OWWWWWWWWWWO.",
    "..OWWWWWWWWWWO.",
    "...OWWWWWWWWO..",
    "...OOOOOOOOOO.."
  ];
  var PAINT = { O: "#EA8B45", W: "#FFFFFF" };

  function handSVG() {
    var w = HAND[0].length, h = HAND.length, px = [];
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var ch = HAND[y][x];
        if (ch === ".") continue;
        px.push('<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + PAINT[ch] + '"/>');
      }
    }
    var body = px.join("");
    return '<svg viewBox="-1 -1 ' + (w + 2) + ' ' + (h + 2) + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' +
             '<g class="sprite">' +
               '<g transform="translate(0.5,0.5)" opacity=".4">' +
                 body.replace(/fill="#FFFFFF"/g, 'fill="#D2691E"').replace(/fill="#EA8B45"/g, 'fill="#D2691E"') +
               '</g>' + body +
             '</g></svg>';
  }

  var cursor = document.getElementById("cursor");
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    cursor.innerHTML = handSVG();
    document.body.classList.add("cursor-on");

    var tx = innerWidth / 2, ty = innerHeight / 2, cx = tx, cy = ty;
    (function loop() {
      cx += (tx - cx) * 0.4;
      cy += (ty - cy) * 0.4;
      cursor.style.transform = "translate3d(" + cx + "px," + cy + "px,0)";
      requestAnimationFrame(loop);
    })();

    addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      tx = e.clientX; ty = e.clientY;
      cursor.classList.add("ready");
    }, { passive: true });
    addEventListener("pointerdown", function () { cursor.classList.add("down"); }, { passive: true });
    addEventListener("pointerup", function () { cursor.classList.remove("down"); }, { passive: true });
    document.addEventListener("mouseleave", function () { cursor.classList.remove("ready"); });
    document.addEventListener("pointerover", function (e) {
      cursor.classList.toggle("over", !!e.target.closest(".card:not(.spent), .reset"));
    }, { passive: true });
  }

  addEventListener("resize", function () {
    Array.prototype.forEach.call(well.querySelectorAll(".slot"), function (slot, n) {
      slot.style.left = (4 + n * 23) + "%";
    });
  }, { passive: true });
})();
</script>
</body>
</html>
